services:
  php:
    build:
      context: ./
      dockerfile: docker/php/DockerFile
    volumes:
      - ./:/var/www/html
    working_dir: /var/www/html
    container_name: php

  nginx:
    image: nginx:alpine
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "8080:80"
    depends_on:
      - php
    container_name: nginx
